version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - NODE_ENV=production
    volumes:
      - app-data:/app/data
    depends_on:
      - db
    command: sh -c "npx prisma db push && npx tsx prisma/seed.ts && node server.js"

  # PostgreSQL (本番環境用オプション)
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=sora2
      - POSTGRES_PASSWORD=sora2password
      - POSTGRES_DB=sora2_prompts
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  app-data:
  postgres-data:
